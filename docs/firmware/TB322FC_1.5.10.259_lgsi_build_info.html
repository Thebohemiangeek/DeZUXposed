  const featureColWidths = [
    ["10%", "10%", "35%", "5%", "5%", "5%", "10%", "10%", "10%"],
  ];
  let linkIndexs = [6,7];

  let sortStates = {
    sku: { index: -1, order: 1 },
    feature: { index: -1, order: 1 }
  };

  let filterVals = {
    sku: null,
    feature: null
  };

  // 初始化页面，渲染两个表格
  window.onload = function () {
    renderTable(skuData, skuColWidths, 'sku');
    renderTable(featureData, featureColWidths, 'feature');
  };

  // 渲染表格函数
  function renderTable(dataArray, colWidths, tableId) {
    const container = document.getElementById(tableId + "-container");
    const oldTable = container.querySelector("table");
    if (oldTable) oldTable.remove(); // 防止重复添加

    const table = document.createElement("table");

    const thead = document.createElement("thead");
    const tbody = document.createElement("tbody");

    // 创建表头行
    const headerRow = document.createElement("tr");
    dataArray[0].forEach((text, idx) => {
      const th = document.createElement("th");
      th.textContent = text;
      th.style.width = colWidths[idx];
      th.addEventListener("click", () => sortTableByColumn(dataArray, colWidths, idx, tableId));
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);

    // 创建内容行
    for (let i = 1; i < dataArray.length; i++) {
      const row = document.createElement("tr");
      dataArray[i].forEach((cellData, colIndex) => {
        const cell = document.createElement("td");
        let displayLink = false;
        if (tableId === 'feature') {
          for (let j = 0; j < linkIndexs.length; j++) {
            if (colIndex === linkIndexs[j]) {
              displayLink = true;
              break;
            }
          }
        }
        if (displayLink) {
          // 如果是列是引用Feature且是Feature信息表，则创建可点击的Feature链接
          if (Array.isArray(cellData)) {
            cellData.forEach(feature => {
              const link = document.createElement('a');
              link.href = '#';
              link.textContent = feature;
              link.onclick = (event) => {
                event.preventDefault();
                highlightFeature(feature);
              };
              cell.appendChild(link);
              if (cellData.indexOf(feature) !== cellData.length -1) {
                cell.appendChild(document.createTextNode(", "));
              }
            });
          } else {
            if (cellData !== "") {
              const link = document.createElement('a');
              link.href = '#';
              link.textContent = cellData;
              link.onclick = (event) => {
                event.preventDefault();
                highlightFeature(cellData);
              };
              cell.appendChild(link);
            }
          }
        } else {
          cell.innerHTML = cellData.replace(/\n/g, "<br>");
        }
        row.appendChild(cell);
      });
      tbody.appendChild(row);
    }

    table.appendChild(thead);
    table.appendChild(tbody);
    container.appendChild(table);
  }

  // 筛选函数
  function filterTableByVal(filterValue, tableId) {
    const container = document.getElementById(tableId + "-container");
    const rows = container.querySelectorAll("table tr");

    rows.forEach(row => {
      const cells = row.querySelectorAll("td");
      let match = false;

      cells.forEach(cell => {
        if (cell.textContent.toLowerCase().includes(filterValue)) {
          match = true;
        }
      });

      if (match || row.querySelector("th")) {
        row.style.display = "";
      } else {
        row.style.display = "none";
      }
    });
  }

  // 排序函数
  function sortTableByColumn(dataArray, colWidths, columnIndex, tableId) {
    const state = sortStates[tableId];
    if (state.index === columnIndex) {
      state.order *= -1; // 切换升序/降序
    } else {
      state.index = columnIndex;
      state.order = 1;
    }

    const sortedData = [...dataArray];
    const headers = sortedData.splice(0, 1); // 移除表头

    sortedData.sort((a, b) => {
      const valA = a[columnIndex];
      const valB = b[columnIndex];

      const relValA = Array.isArray(valA) ? valA.join(",") : valA
      const relValB = Array.isArray(valB) ? valB.join(",") : valB
      if (!isNaN(relValA) && !isNaN(relValB)) {
        return (Number(relValA) - Number(relValB)) * state.order;
      } else {
        return relValA.localeCompare(relValB) * state.order;
      }
    });

    sortedData.unshift(headers[0]); // 加回表头
    renderTable(sortedData, colWidths, tableId);
    const filterValue = filterVals[tableId];
    if (filterValue) {
      filterTableByVal(filterValue, tableId);
    }
  }

  // 筛选函数
  function filterTable(inputElement, tableId) {
    const filterValue = inputElement.value.toLowerCase();
    filterVals[tableId] = filterValue;
    filterTableByVal(filterValue, tableId);
  }

  // 高亮Feature
  function highlightFeature(featureName) {
    const tableRows = document.querySelectorAll('#feature-container table tr');
    tableRows.forEach(row => {
      const nameCell = row.querySelector('td:first-child'); // 获取第一列（Feature）
      if (nameCell && nameCell.textContent === featureName) {
        tableRows.forEach(r => r.classList.remove('highlight')); // 移除所有高亮
        row.classList.add('highlight'); // 添加高亮
        row.scrollIntoView({ behavior: 'smooth', block: 'center' }); // 平滑滚动到目标行
      }
    });
  }
</script>
